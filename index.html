<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101918"><title>RIJEČ. | Bosnisch lernen</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&display=swap');
*{box-sizing:border-box}body{margin:0;background:#0e1717;color:#f2f8f2;font:15px 'DM Sans',sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #d8f57e;outline-offset:3px}.layout{display:flex;min-height:100vh}.sidebar{width:235px;flex-shrink:0;height:100vh;position:sticky;top:0;background:#132020;border-right:1px solid #2c3b38;padding:30px 17px}.logo{font:900 36px Outfit;color:#dafa8d;letter-spacing:-2px;margin:0 10px}.subtitle{font-size:10px;letter-spacing:2px;color:#9bb8aa;margin:0 12px 50px}.nav{display:grid;gap:9px}.nav button{background:transparent;color:#a1b6af;border:0;border-radius:13px;padding:16px;text-align:left;font-weight:800}.nav button.active,.nav button:hover{color:#e4ffbc;background:#2a4238}.main{width:min(1160px,100%);margin:auto;padding:40px 5% 100px}.eyebrow{letter-spacing:2px;font-size:12px;font-weight:800;color:#a6bdab}.top{display:flex;justify-content:space-between;align-items:center}.top h1{font:800 clamp(28px,4vw,42px) Outfit;margin:7px 0 26px}.pill{border:1px solid #3e5449;border-radius:30px;padding:10px 15px;font-size:13px}.hero{background:linear-gradient(110deg,#d8f38e,#aedc82);color:#163225;border-radius:25px;padding:36px;min-height:220px;position:relative;overflow:hidden}.hero h2{font:900 clamp(32px,5vw,51px) Outfit;letter-spacing:-2px;margin:8px 0}.hero p{max-width:410px;line-height:1.6;font-size:14px}.hero .mark{position:absolute;right:10%;top:22px;font-size:115px;transform:rotate(-12deg);opacity:.75}.btn{border:0;border-radius:13px;padding:14px 20px;background:#1a3028;color:#e9ffc8;font-weight:800;transition:.2s}.btn:hover{filter:brightness(1.2);transform:translateY(-2px)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:20px 0 30px}.stat,.card,.panel{border:1px solid #30423d;background:#192827;border-radius:20px;padding:22px}.stat strong{display:block;font:800 30px Outfit;margin:7px 0}.muted{color:#a0b5ad;font-size:13px}.section{font:800 23px Outfit;margin:32px 0 17px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{display:flex;flex-direction:column;gap:13px;transition:.2s}.card:hover{border-color:#9cce82;transform:translateY(-3px)}.card .emoji{font-size:35px}.card h3{font:800 19px Outfit;margin:0}.card p{color:#a0b5ad;font-size:13px;line-height:1.6;flex:1;margin:0}.card button,.answer{border:1px solid #4d6757;border-radius:12px;background:#293e34;padding:13px;color:#efffd4;font-weight:800}.card button:hover,.answer:hover{background:#3b5948}.bar{background:#3a4c42;border-radius:20px;height:10px;overflow:hidden;margin:16px 0}.bar div{height:100%;background:#d8f38e;transition:width .4s}.quiz{max-width:730px;margin:35px auto}.quiz h2{font:800 clamp(24px,4vw,36px) Outfit}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answer{text-align:left;padding:20px;font-size:16px}.answer.correct{border-color:#c7ff8d;background:#38553a}.answer.wrong{border-color:#ff8d9b;background:#5b3439}.feedback{min-height:36px;color:#d8f38e;font-weight:800;margin:18px 0}.back{border:0;background:none;color:#b1c7ba;padding:10px 0}.vocab{width:100%;border-collapse:collapse}.vocab td{padding:17px 10px;border-bottom:1px solid #33473d}.vocab td:last-child{text-align:right}.speak{background:#30483c;color:#e0ffb6;border:0;border-radius:10px;padding:10px}.mobile{display:none}@media(max-width:840px){.sidebar{display:none}.main{padding:30px 20px 100px}.grid{grid-template-columns:repeat(2,1fr)}.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;justify-content:space-around;background:#132020;border-top:1px solid #30423d;padding:10px 3px env(safe-area-inset-bottom);z-index:5}.mobile button{background:none;border:0;color:#a5baad;padding:10px 6px;font-weight:800;font-size:12px}.mobile button.active{color:#dafa8d}}@media(max-width:540px){.grid{grid-template-columns:1fr}.hero{padding:26px}.hero .mark{right:8px;top:12px;font-size:70px;opacity:.2}.stats{gap:8px}.stat{padding:14px}.stat strong{font-size:24px}.muted{font-size:11px}.answers{grid-template-columns:1fr}.top h1{font-size:29px}.pill{font-size:11px;padding:8px}}
</style></head><body><div class="layout"><aside class="sidebar"><div class="logo">RIJEČ.</div><div class="subtitle">UČI BOSANSKI 🇧🇦</div><nav class="nav" id="nav"></nav></aside><main class="main" id="content"></main></div><nav class="mobile" id="mobile"></nav><script>
const units=[
{icon:'👋',title:'Begrüßungen',desc:'Hallo, Tschüss und wie es dir geht.',words:[['Zdravo','Hallo'],['Dobro jutro','Guten Morgen'],['Dobar dan','Guten Tag'],['Laku noć','Gute Nacht'],['Kako si?','Wie geht es dir?'],['Dobro sam','Mir geht es gut']]},
{icon:'🤝',title:'Vorstellen',desc:'Namen, Herkunft und erste Gespräche.',words:[['Kako se zoveš?','Wie heißt du?'],['Zovem se...','Ich heiße...'],['Odakle si?','Woher kommst du?'],['Ja sam iz Njemačke','Ich komme aus Deutschland'],['Drago mi je','Freut mich'],['Hvala','Danke']]},
{icon:'🏡',title:'Familie',desc:'Wörter für die Menschen um dich herum.',words:[['Majka','Mutter'],['Otac','Vater'],['Brat','Bruder'],['Sestra','Schwester'],['Baka','Oma'],['Djed','Opa']]},
{icon:'🍽️',title:'Essen & Trinken',desc:'Bestelle auf Bosnisch und lerne Alltagswörter.',words:[['Voda','Wasser'],['Hljeb','Brot'],['Kafa','Kaffee'],['Mlijeko','Milch'],['Hrana','Essen'],['Račun, molim','Die Rechnung, bitte']]},
{icon:'🔢',title:'Zahlen',desc:'Zähle und erkenne die wichtigsten Zahlen.',words:[['Jedan','Eins'],['Dva','Zwei'],['Tri','Drei'],['Četiri','Vier'],['Pet','Fünf'],['Deset','Zehn']]},
{icon:'💬',title:'Alltag',desc:'Nützliche Sätze für echte Gespräche.',words:[['Molim','Bitte'],['Izvini','Entschuldigung'],['Ne razumijem','Ich verstehe nicht'],['Gdje je...?','Wo ist...?'],['Koliko košta?','Wie viel kostet es?'],['Vidimo se','Bis bald']]}];
const key='rijec-progress-v1';let saved={};try{saved=JSON.parse(localStorage.getItem(key))||{}}catch{};let state={page:'start',unit:0,index:0,score:0,locked:false,questions:[]};const tabs=[['start','⌂ Übersicht'],['lessons','▦ Lektionen'],['words','♢ Vokabeln'],['progress','◷ Fortschritt']];const $=id=>document.getElementById(id);function store(){localStorage.setItem(key,JSON.stringify(saved))}function totals(){return {done:units.filter((_,i)=>saved[i]).length,xp:Object.values(saved).reduce((s,v)=>s+(v||0),0)}}function nav(){for(const id of ['nav','mobile'])$(id).innerHTML=tabs.map(([p,label])=>'<button class="'+(state.page===p?'active':'')+'" data-page="'+p+'">'+label+'</button>').join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page))}function go(page){state.page=page;state.locked=false;nav();render();window.scrollTo({top:0,behavior:'smooth'})}function header(title,tag='DEIN LERNBEREICH'){return '<div class="top"><div><div class="eyebrow">'+tag+'</div><h1>'+title+'</h1></div><div class="pill">🇧🇦 A1 · Anfänger</div></div>'}function render(){const t=totals(),pct=Math.round(t.done/units.length*100);if(state.page==='start')$('content').innerHTML=header('Zdravo! Schön, dass du da bist.')+'<section class="hero"><div><div class="eyebrow" style="color:#496b47">DEIN WEG ZUM BOSNISCH</div><h2>Svaka riječ broji.</h2><p>Jedes Wort zählt. Lerne jeden Tag ein bisschen und sprich schon bald deine ersten Sätze auf Bosnisch.</p><button class="btn" id="begin">Jetzt lernen →</button></div><div class="mark">🇧🇦</div></section><div class="stats"><div class="stat"><span class="muted">✨ Erfahrung</span><strong>'+t.xp+' XP</strong></div><div class="stat"><span class="muted">📚 Lektionen</span><strong>'+t.done+' / '+units.length+'</strong></div><div class="stat"><span class="muted">🎯 Fortschritt</span><strong>'+pct+'%</strong></div></div><h2 class="section">Dein Lernpfad</h2><div class="grid">'+cards()+'</div>';else if(state.page==='lessons')$('content').innerHTML=header('Deine Lektionen','SCHRITT FÜR SCHRITT')+'<div class="panel"><b>Level A1 · Dein Einstieg</b><div class="bar"><div style="width:'+pct+'%"></div></div><span class="muted">'+t.done+' von '+units.length+' Lektionen abgeschlossen</span></div><h2 class="section">Entdecke die Themen</h2><div class="grid">'+cards()+'</div>';else if(state.page==='words')$('content').innerHTML=header('Deine Vokabelwelt','HÖREN & VERSTEHEN')+'<div class="panel"><p class="muted">Tippe auf 🔊, um die bosnische Aussprache anzuhören. Die Verfügbarkeit der Stimme hängt von deinem Gerät ab.</p><table class="vocab"><tbody>'+units.flatMap(u=>u.words).map(([bs,de])=>'<tr><td><b>'+bs+'</b><div class="muted">'+de+'</div></td><td><button class="speak" data-say="'+bs+'">🔊</button></td></tr>').join('')+'</tbody></table></div>';else if(state.page==='progress')$('content').innerHTML=header('Dein Fortschritt','DEIN WEG')+'<div class="stats"><div class="stat"><span class="muted">Gesammelte XP</span><strong>'+t.xp+'</strong></div><div class="stat"><span class="muted">Abgeschlossen</span><strong>'+t.done+'</strong></div><div class="stat"><span class="muted">Fortschritt</span><strong>'+pct+'%</strong></div></div><div class="panel"><b>Dein A1-Lernpfad</b><div class="bar"><div style="width:'+pct+'%"></div></div><div class="muted">'+t.done+' / '+units.length+' Lektionen geschafft</div></div><h2 class="section">Deine Meilensteine</h2><div class="grid">'+units.map((u,i)=>'<div class="card"><div class="emoji">'+(saved[i]?'🏆':'🔒')+'</div><h3>'+u.title+'</h3><p>'+(saved[i]?'Abgeschlossen · '+saved[i]+' XP':'Noch nicht abgeschlossen')+'</p></div>').join('')+'</div>';else if(state.page==='quiz'){quiz();return}document.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>start(+b.dataset.unit));document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(b.dataset.say));if($('begin'))$('begin').onclick=()=>start(units.findIndex((_,i)=>!saved[i])===-1?0:units.findIndex((_,i)=>!saved[i]))}function cards(){return units.map((u,i)=>'<article class="card"><div class="emoji">'+u.icon+'</div><div class="eyebrow">LEKTION '+String(i+1).padStart(2,'0')+(saved[i]?' · ✓ ERLEDIGT':'')+'</div><h3>'+u.title+'</h3><p>'+u.desc+'</p><button data-unit="'+i+'">'+(saved[i]?'Wiederholen ↗':'Lektion starten →')+'</button></article>').join('')}function start(i){state={...state,page:'quiz',unit:i,index:0,score:0,locked:false,questions:units[i].words.map((word,index)=>({word,index})).sort(()=>Math.random()-.5)};nav();render();window.scrollTo({top:0})}function questionOptions(correct){let pool=units.flatMap(u=>u.words.map(w=>w[1])).filter(x=>x!==correct);pool=[...new Set(pool)].sort(()=>Math.random()-.5).slice(0,3);return [correct,...pool].sort(()=>Math.random()-.5)}let options=[];function quiz(){const u=units[state.unit],q=state.questions[state.index];if(!q){finish();return}options=questionOptions(q.word[1]);$('content').innerHTML='<button class="back" id="back">← Lektionen</button><div class="quiz"><div class="eyebrow">'+u.title.toUpperCase()+' · FRAGE '+(state.index+1)+' / '+state.questions.length+'</div><div class="bar"><div style="width:'+Math.round(state.index/state.questions.length*100)+'%"></div></div><h2>Was bedeutet „'+q.word[0]+'“?</h2><button class="speak" id="listen">🔊 Anhören</button><div class="answers" style="margin-top:25px">'+options.map((a,i)=>'<button class="answer" data-answer="'+i+'">'+a+'</button>').join('')+'</div><div class="feedback" id="feedback" aria-live="polite"></div><button class="btn" id="next" style="display:none">Weiter →</button></div>';$('back').onclick=()=>go('lessons');$('listen').onclick=()=>speak(q.word[0]);document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(state.locked)return;state.locked=true;const good=options[+b.dataset.answer]===q.word[1];if(good)state.score++;document.querySelectorAll('[data-answer]').forEach((x,i)=>{x.disabled=true;if(options[i]===q.word[1])x.classList.add('correct');else if(x===b)x.classList.add('wrong')});$('feedback').textContent=good?'Tačno! Richtig! 🎉':'Fast! Richtig ist: '+q.word[1];$('next').style.display='inline-block'});$('next').onclick=()=>{state.index++;state.locked=false;quiz()}}function finish(){const total=state.questions.length,points=state.score*10;const old=saved[state.unit]||0;if(points>old){saved[state.unit]=points;store()}$('content').innerHTML='<div class="quiz panel" style="text-align:center"><div style="font-size:65px">🎉</div><div class="eyebrow">BRAVO!</div><h1 style="font:900 41px Outfit">Lektion geschafft!</h1><p>Du hast '+state.score+' von '+total+' Fragen richtig beantwortet.</p><h2 style="color:#dafa8d">+'+points+' XP erreicht</h2><p class="muted">Dein bester Wert für diese Lektion wird gespeichert.</p><button class="btn" id="again">Nochmal üben</button> <button class="btn" id="home">Zur Übersicht</button></div>';$('again').onclick=()=>start(state.unit);$('home').onclick=()=>go('start')}function speak(text){if(!('speechSynthesis'in window)){alert('Dein Browser unterstützt keine Sprachausgabe.');return}speechSynthesis.cancel();const utter=new SpeechSynthesisUtterance(text);utter.lang='bs-BA';utter.rate=.83;speechSynthesis.speak(utter)}nav();render();
</script></body></html>
